name: Create Draft Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v1.0.0)'
        required: true
        default: 'v0.1.0'

permissions:
  actions: write
  contents: write

jobs:
  # 🛠️ ジョブ1: 別のワークフローを「引用」してビルドを実行する
  run-build:
    uses: ./.github/workflows/platformio-ci.yaml

  # 🏷️ ジョブ2: ビルドが成功したらDraft Releaseを作成する
  release:
    needs: run-build
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref_name }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      # タグの作成とプッシュ（手動トリガーの場合のみ）
      - name: Create and Push Git Tag (Manual Only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag ${{ env.RELEASE_TAG }}
          git push origin ${{ env.RELEASE_TAG }}

      - name: Download Artifact from CI
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-firmware
          path: artifacts

      # Draft Releaseを作成してファイルを添付
      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.bin
            artifacts/**/*.elf
            artifacts/**/*.uf2