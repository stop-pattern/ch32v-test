name: Create Draft Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v1.0.0)'
        required: true
        default: 'v0.1.0'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      # 他のワークフロー（PlatformIO CI）を強制実行して完了を待つ
      - id: trigger_ci
        name: Trigger CI workflow and wait
        uses: actions/github-script@v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow_id = 'platformio-ci.yaml';
            const ref = 'main';
            const dispatchTime = new Date().toISOString();
            await github.actions.createWorkflowDispatch({ owner, repo, workflow_id, ref });
            console.log(`Dispatched ${workflow_id} at ${dispatchTime}`);
            const waitSeconds = 10;
            const maxAttempts = 60; // 最大 10 分待機
            for (let i = 0; i < maxAttempts; i++) {
              const runs = await github.actions.listWorkflowRuns({ owner, repo, workflow_id, per_page: 10, event: 'workflow_dispatch' });
              const run = runs.data.workflow_runs.find(r => new Date(r.created_at) >= new Date(dispatchTime));
              if (run && run.status === 'completed') {
                if (run.conclusion === 'success') {
                  console.log(`Found successful run: ${run.id}`);
                  return run.id;
                } else {
                  throw new Error(`Workflow run completed with conclusion: ${run.conclusion}`);
                }
              }
              console.log(`Waiting for workflow run... attempt ${i+1}/${maxAttempts}`);
              await new Promise(r => setTimeout(r, waitSeconds * 1000));
            }
            throw new Error('Timed out waiting for workflow run to complete');

      - name: Download Artifact from CI
        uses: dawidd6/action-download-artifact@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: platformio-ci.yaml
          workflow_conclusion: success
          run_id: ${{ steps.trigger_ci.outputs.result }}
          name: ${{ github.event.repository.name }}-firmware
          path: artifacts

      # Draft Releaseを作成してファイルを添付
      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: Release ${{ github.event.inputs.tag_name }}
          draft: true
          prerelease: false
          files: |
            .pio/build/**/*.bin
            .pio/build/**/*.elf
            .pio/build/**/*.map
            .pio/build/**/*.lst
            .pio/build/**/*.uf2
